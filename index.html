<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الموقع قيد التطوير</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top right, #1e293b, #0f172a 70%);
      color: #f8fafc;
      padding: 20px;
      overflow: hidden;
    }

    .card {
      position: relative;
      max-width: 560px;
      width: 100%;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 24px;
      padding: 48px 32px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(56, 189, 248, 0.12);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: #38bdf8;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 800;
      margin-bottom: 14px;
      line-height: 1.3;
    }

    p {
      color: #94a3b8;
      font-size: 1.05rem;
      line-height: 1.8;
      margin-bottom: 32px;
    }

    .progress-wrapper {
      background: #0f172a;
      border-radius: 999px;
      height: 10px;
      width: 100%;
      overflow: hidden;
      margin-bottom: 10px;
      border: 1px solid rgba(148, 163, 184, 0.1);
    }

    .progress-bar {
      height: 100%;
      width: 75%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 999px;
      animation: load 2s ease-out;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 32px;
    }

    .contact-btn {
      display: inline-block;
      text-decoration: none;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 12px;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .contact-btn:hover {
      background: #7dd3fc;
      transform: translateY(-2px);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }

    @keyframes load {
      from { width: 0%; }
      to { width: 75%; }
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.65rem; }
      .card { padding: 36px 20px; }
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="badge">
      <span class="dot"></span>
      <span>قريباً جداً</span>
    </div>

    <h1>الموقع قيد التطوير حالياً</h1>
    <p>
      نعمل على تجهيز تجربة مميزة تليق بكم. سنعود للعمل بكامل طاقتنا في أقرب وقت، شكراً لتفهمكم وانتظاركم.
    </p>

    <div class="progress-wrapper">
      <div class="progress-bar"></div>
    </div>
    <div class="progress-text">
      <span>نسبة الإنجاز</span>
      <span>75%</span>
    </div>

    <!-- استبدل الرابط ببريدك الإلكتروني أو حسابك للتواصل -->
    <a href="mailto:info@example.com" class="contact-btn">تواصل معنا</a>
  </main>

</body>
</html>
