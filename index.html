<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>قيد التطوير</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Tahoma, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .container {
            text-align: center;
            padding: 40px 25px;
            width: 90%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #fbbf24;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
            color: #e2e8f0;
            margin-bottom: 25px;
        }

        .developer {
            font-size: 17px;
            margin-bottom: 10px;
        }

        .phone {
            display: inline-block;
            direction: ltr;
            text-decoration: none;
            background: #22c55e;
            color: white;
            padding: 14px 25px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            transition: 0.3s;
        }

        .phone:hover {
            background: #16a34a;
            transform: scale(1.05);
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🚧</div>

        <h1>قيد التطوير</h1>

        <p>
            نعمل حالياً على تطوير وتحسين التطبيق.<br>
            سيتم إطلاق النسخة الجديدة قريباً.
        </p>

        <div class="developer">
            للتواصل مع المهندس<br>
            <strong>عمرو جمال عوض</strong>
        </div>

        <br>

        <a class="phone" href="tel:01033873551">
            01033873551
        </a>

        <div class="footer">
            © جميع الحقوق محفوظة
        </div>

    </div>

</body>
</html>
